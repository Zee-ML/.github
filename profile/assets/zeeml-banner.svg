<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" role="img" aria-label="ZeeML — Applied Linguistic, Data and Quantitative Engineering">
  <defs>
    <linearGradient id="zmlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="52%" stop-color="#0D1628"/>
      <stop offset="100%" stop-color="#091D26"/>
    </linearGradient>
    <linearGradient id="zmlAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="zmlCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111C33" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0B1324" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="zmlGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#zmlBg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#zmlGrid)"/>
  <rect x="1.5" y="1.5" width="1197" height="317" rx="16.5" fill="none" stroke="#1E293B" stroke-width="2"/>
  <rect x="64" y="0" width="360" height="4" rx="2" fill="url(#zmlAccent)"/>

  <!-- Geometric Brand Monogram -->
  <g transform="translate(64, 58)">
    <rect width="74" height="74" rx="16" fill="#0F172A" stroke="url(#zmlAccent)" stroke-width="2.2"/>
    <path d="M 20 23 H 54 L 22 51 H 54" fill="none" stroke="url(#zmlAccent)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="54" cy="23" r="4" fill="#10B981"/>
    <circle cx="22" cy="51" r="4" fill="#06B6D4"/>
  </g>

  <!-- Headline & Subtitle -->
  <text x="158" y="88" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    ZeeML
  </text>
  <rect x="282" y="64" width="136" height="28" rx="14" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="350" y="83" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">
    zeeml.com ✓
  </text>

  <text x="158" y="122" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500">
    Applied Computational Linguistics, Deterministic Data Pipelines &amp; Quantitative Grading Engines
  </text>

  <!-- 4 Engineering Pillar Cards -->
  <g transform="translate(64, 166)">
    <rect x="0" y="0" width="256" height="98" rx="12" fill="url(#zmlCard)" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="24" cy="28" r="5" fill="#10B981"/>
    <text x="38" y="33" fill="#E2E8F0" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700">Linguistic Cadence Lab</text>
    <text x="20" y="58" fill="#94A3B8" font-family="Inter, -apple-system, sans-serif" font-size="12">Sentence burstiness, Yule's K</text>
    <text x="20" y="76" fill="#64748B" font-family="ui-monospace, monospace" font-size="11">/ai-humanizer • /ai-detector</text>

    <rect x="272" y="0" width="256" height="98" rx="12" fill="url(#zmlCard)" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="296" cy="28" r="5" fill="#06B6D4"/>
    <text x="310" y="33" fill="#E2E8F0" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700">RFC-4180 Data Streams</text>
    <text x="292" y="58" fill="#94A3B8" font-family="Inter, -apple-system, sans-serif" font-size="12">Nested JSON flattening &amp; docs</text>
    <text x="292" y="76" fill="#64748B" font-family="ui-monospace, monospace" font-size="11">/json-to-csv • /pdf-to-word</text>

    <rect x="544" y="0" width="256" height="98" rx="12" fill="url(#zmlCard)" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="568" cy="28" r="5" fill="#3B82F6"/>
    <text x="582" y="33" fill="#E2E8F0" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700">45-System Grading Math</text>
    <text x="564" y="58" fill="#94A3B8" font-family="Inter, -apple-system, sans-serif" font-size="12">Cross-border CGPA &amp; GPA matrices</text>
    <text x="564" y="76" fill="#64748B" font-family="ui-monospace, monospace" font-size="11">/cgpa-calculator • /percentage</text>

    <rect x="816" y="0" width="256" height="98" rx="12" fill="url(#zmlCard)" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="840" cy="28" r="5" fill="#A855F7"/>
    <text x="854" y="33" fill="#E2E8F0" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700">IDE, MCP &amp; SDK Suite</text>
    <text x="836" y="58" fill="#94A3B8" font-family="Inter, -apple-system, sans-serif" font-size="12">Browser, VS Code, Copilot &amp; CLI</text>
    <text x="836" y="76" fill="#64748B" font-family="ui-monospace, monospace" font-size="11">NPM • PyPI • Crates • OpenVSX</text>
  </g>
</svg>
